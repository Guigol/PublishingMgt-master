
<!-- <h2>Login</h2> -->

<form (ngSubmit)="onSubmit()">

  <input
    type="text"
    placeholder="Login"
    [(ngModel)]="login"
    name="login"
  >

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
    name="password"
  >

  <button type="submit">
    Se connecter
  </button>

</form>

@if (error) {
  <div class="error">{{error}}</div>
}
