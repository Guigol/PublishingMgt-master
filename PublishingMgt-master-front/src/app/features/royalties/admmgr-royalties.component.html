<div class="royalties-container">

  <h2>Vue Royalties</h2>

  <div class="filters">

    <!-- Author -->
    <div class="filter-group">
      <label>Auteur</label>
            <select
            [(ngModel)]="selectedAuthorId"
            (ngModelChange)="onAuthorChange($event)"
          >
            <option [ngValue]="null">-- Choisir un auteur --</option>
            <option *ngFor="let a of authors" [ngValue]="a.authorId">
              {{ a.firstname }} {{ a.surname }}
            </option>
      </select>
     
    </div>

    <!-- Book -->
    <div class="filter-group">
      <label>Livre</label>
      <select
        [(ngModel)]="selectedBookId"
        (ngModelChange)="onBookChange()"
      >
        <option [ngValue]="null">-- Choisir un livre --</option>
        <option *ngFor="let b of books" [ngValue]="b.book_id">
          {{ b.title }}
        </option>
      </select>
    </div>

  </div>

  <!-- TABLE -->
  <table
    
    class="royalties-table"
  >

    <thead>
      <tr>
        <th>Livre</th>
        <th>Mois</th>
        <th>Année</th>
        <th>Montant</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of royalties | slice:(pageIndex*pageSize):((pageIndex+1)*pageSize)">
        
        <td>{{ r.title }}</td>
        <td>{{ r.month }}</td>
        <td>{{ r.year }}</td>
        <td>{{ r.montant | number:'1.2-2' }} €</td>
      </tr>
    </tbody>

  </table>

  <div class="paginator">
  <button (click)="prevPage()" [disabled]="pageIndex === 0">
    ◀
  </button>

  <span>Page {{ pageIndex + 1 }} / {{ totalPages }}</span>

  <button (click)="nextPage()" [disabled]="pageIndex >= totalPages - 1">
    ▶
  </button>
</div>

</div>
